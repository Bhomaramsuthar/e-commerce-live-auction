server:
  port: 8086

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bidcraft_auth
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Secret key used for signing JWTs (must be at least 256 bits). 
# This should match the secret in gateway-service.
jwt:
  secret: a48624c803f7e53f1406450f38b255da10faeb2e08e8b0a94b5952f200c9e831
  expiration-ms: 86400000 # 24 hours
