version: '3'
services:
  # For the Query Side (High-Speed Reads)
  redis:
    image: redis:7.2-alpine
    container_name: e-commerce-redis
    ports:
      - "6379:6379"
    restart: always

  # For the Command Side (Event Store & Message Routing)
  axon-server:
    image: axoniq/axonserver:latest
    container_name: e-commerce-axon-server
    ports:
      - "8024:8024" # UI and HTTP API
      - "8124:8124" # gRPC communication port
    environment:
      - AXONIQ_AXONSERVER_DEVMODE_ENABLED=true
    restart: always

  # ─── PostgreSQL (for order-service) ──────────────────
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: bidcraft_orders

  # ─── Zookeeper (for Kafka) ──────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  # ─── Kafka ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
