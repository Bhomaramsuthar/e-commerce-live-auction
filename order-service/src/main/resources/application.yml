server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bidcraft_orders
    username: postgres # Default username is usually 'postgres'
    password: 12345
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jpa:
    hibernate:
    p  ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  instance:
    preferIpAddress: true
  client:
    service-url:
      defaul tZone: http://localhost:8761/eureka/

  bootstrap-servers: localhost:9092
